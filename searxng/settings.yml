use_default_settings: true

general:
  instance_name: "Sivaxi Search"

server:
  secret_key: "sivaxi-searxng-local-secret-key-change-me"
  bind_address: "0.0.0.0"
  port: 8080
  base_url: http://localhost:8080/
  image_proxy: false
  http_protocol_version: "1.1"

search:
  safe_search: 0
  autocomplete: ""
  formats:
    - html
    - json

ui:
  static_use_hash: true

engines:
  - name: google
    engine: google
    shortcut: go

  - name: bing
    engine: bing
    shortcut: bi

  - name: brave
    engine: brave
    shortcut: br

  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
