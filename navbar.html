<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fully Featured Navbar</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">

    <!-- Navbar Container -->
    <nav class="bg-white shadow-md fixed w-full top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                
                <!-- Left: Logo & Main Nav Links -->
                <div class="flex items-center space-x-8">
                    <!-- Logo -->
                    <div class="flex-shrink-0 flex items-center">
                        <a href="#" class="text-xl font-bold text-indigo-600">BrandName</a>
                    </div>

                    <!-- Desktop Menu Links -->
                    <div class="hidden md:flex items-center space-x-6">
                        <a href="#" class="text-gray-700 hover:text-indigo-600 font-medium transition-colors">Home</a>
                        <a href="#" class="text-gray-700 hover:text-indigo-600 font-medium transition-colors">Features</a>
                        
                        <!-- Dropdown Menu (Desktop) -->
                        <div class="relative group">
                            <button id="dropdown-btn" class="flex items-center text-gray-700 hover:text-indigo-600 font-medium focus:outline-none py-2">
                                <span>Dropdown</span>
                                <svg class="w-4 h-4 ml-1 transform group-hover:rotate-180 transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                                </svg>
                            </button>
                            <!-- Dropdown Content -->
                            <div id="dropdown-menu" class="absolute left-0 mt-0 w-48 bg-white border border-gray-200 rounded-md shadow-lg py-1 hidden group-hover:block transition-all">
                                <a href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-indigo-50 hover:text-indigo-600">Analytics</a>
                                <a href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-indigo-50 hover:text-indigo-600">Engagement</a>
                                <a href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-indigo-50 hover:text-indigo-600">Security</a>
                            </div>
                        </div>

                        <a href="#" class="text-gray-700 hover:text-indigo-600 font-medium transition-colors">Pricing</a>
                    </div>
                </div>

                <!-- Right: Search Bar & Profile/Auth (Desktop) -->
                <div class="hidden md:flex items-center space-x-4">
                    <!-- Search Input -->
                    <div class="relative">
                        <input type="text" placeholder="Search..." class="w-48 lg:w-64 pl-9 pr-4 py-1.5 text-sm bg-gray-100 border border-transparent rounded-full focus:outline-none focus:bg-white focus:border-indigo-500 transition-all">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                            </svg>
                        </div>
                    </div>

                    <!-- CTA Buttons -->
                    <a href="#" class="text-gray-700 hover:text-indigo-600 font-medium text-sm">Log in</a>
                    <a href="#" class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-indigo-700 transition-colors shadow-sm">Sign up</a>
                </div>

                <!-- Mobile Menu Button -->
                <div class="flex items-center md:hidden">
                    <button id="mobile-menu-btn" class="text-gray-700 hover:text-indigo-600 focus:outline-none p-2">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path id="menu-icon" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                        </svg>
                    </button>
                </div>

            </div>
        </div>

        <!-- Mobile Menu Drawer -->
        <div id="mobile-menu" class="hidden md:hidden bg-white border-t border-gray-200 px-4 pt-2 pb-4 space-y-2">
            <a href="#" class="block px-3 py-2 rounded-md text-base font-medium text-gray-700 hover:text-indigo-600 hover:bg-gray-50">Home</a>
            <a href="#" class="block px-3 py-2 rounded-md text-base font-medium text-gray-700 hover:text-indigo-600 hover:bg-gray-50">Features</a>
            
            <!-- Mobile Dropdown Accordion -->
            <div>
                <button id="mobile-dropdown-btn" class="w-full flex justify-between items-center px-3 py-2 rounded-md text-base font-medium text-gray-700 hover:text-indigo-600 hover:bg-gray-50">
                    <span>Dropdown</span>
                    <svg id="mobile-dropdown-icon" class="w-4 h-4 transform transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                    </svg>
                </button>
                <div id="mobile-dropdown-menu" class="hidden pl-4 space-y-1 mt-1">
                    <a href="#" class="block px-3 py-2 rounded-md text-sm font-medium text-gray-600 hover:text-indigo-600 hover:bg-gray-50">Analytics</a>
                    <a href="#" class="block px-3 py-2 rounded-md text-sm font-medium text-gray-600 hover:text-indigo-600 hover:bg-gray-50">Engagement</a>
                    <a href="#" class="block px-3 py-2 rounded-md text-sm font-medium text-gray-600 hover:text-indigo-600 hover:bg-gray-50">Security</a>
                </div>
            </div>

            <a href="#" class="block px-3 py-2 rounded-md text-base font-medium text-gray-700 hover:text-indigo-600 hover:bg-gray-50">Pricing</a>

            <!-- Mobile Search Bar -->
            <div class="pt-2">
                <input type="text" placeholder="Search..." class="w-full px-4 py-2 text-sm bg-gray-100 border border-gray-200 rounded-lg focus:outline-none focus:bg-white focus:border-indigo-500">
            </div>

            <!-- Mobile Auth Buttons -->
            <div class="pt-4 border-t border-gray-200 flex flex-col space-y-2">
                <a href="#" class="w-full text-center py-2 border border-gray-300 rounded-lg text-sm font-medium text-gray-700 hover:bg-gray-50">Log in</a>
                <a href="#" class="w-full text-center py-2 bg-indigo-600 text-white rounded-lg text-sm font-medium hover:bg-indigo-700 shadow-sm">Sign up</a>
            </div>
        </div>
    </nav>

    <!-- Page Content Placeholder to demonstrate sticky/fixed nav -->
    <div class="pt-24 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <h1 class="text-3xl font-bold text-gray-900">Welcome to the Fully Featured Navbar Demo</h1>
        <p class="mt-4 text-gray-600">Scroll down or resize the screen to test the responsive mobile menu and desktop dropdowns.</p>
    </div>

    <!-- JavaScript for Mobile Menu & Dropdowns -->
    <script>
        const mobileMenuBtn = document.getElementById('mobile-menu-btn');
        const mobileMenu = document.getElementById('mobile-menu');
        
        const mobileDropdownBtn = document.getElementById('mobile-dropdown-btn');
        const mobileDropdownMenu = document.getElementById('mobile-dropdown-menu');
        const mobileDropdownIcon = document.getElementById('mobile-dropdown-icon');

        // Toggle mobile menu drawer
        mobileMenuBtn.addEventListener('click', () => {
            mobileMenu.classList.toggle('hidden');
        });

        // Toggle mobile dropdown accordion
        mobileDropdownBtn.addEventListener('click', () => {
            mobileDropdownMenu.classList.toggle('hidden');
            mobileDropdownIcon.classList.toggle('rotate-180');
        });
    </script>
</body>
</html>
